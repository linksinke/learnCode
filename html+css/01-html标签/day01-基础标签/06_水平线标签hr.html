<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta http-equiv="content-type" content="text/html;charset=UTF-8">
    <meta name="description" content="hr标签的使用">
    <title>HTML标签</title>
</head>

<body>
    hr标签是水平线标签，可以用作分割文本内容，他会自动换行，不需要加入br标签，使用起来蛮方便的<br/>
    赤<hr style="border:5px solid #F00;width:50%;" />
    橙<hr style="border:10px solid #F60;width:50%;" />
    黄<hr style="border:15px solid #FF0;width:50%;" />
    绿<hr style="border:20px solid #0C0;width:50%;" />
    青<hr style="border:25px solid #699;width:50%;" />
    蓝<hr style="border:30px solid #06C;width:50%;" />
    紫<hr style="border:35px solid #909;width:50%;" />
    <hr />
    赤<hr size="10" color="#F00" width="50%" align="center" />
    橙<hr size="20" color="#F60" width="50%" align="center" />
    黄<hr size="30" color="#FF0" width="50%" align="center" />
    绿<hr size="40" color="#0C0" width="50%" align="center" />
    青<hr size="50" color="#699" width="50%" align="center" />
    蓝<hr size="60" color="#06C" width="50%" align="center" />
    紫<hr size="70" color="#909" width="50%" align="center" />
</body>

</html>
