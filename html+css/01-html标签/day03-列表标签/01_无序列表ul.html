<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta http-equiv="content-type" content="text/html;charset=UTF-8">
    <meta name="description" content="ul标签的使用">
    <title>HTML标签</title>
</head>

<body>
    ul是无序标签
    <hr />
    <h4>type=disc 时的无序列表</h4>
    <ul>
        <li>桔子</li>
        <li>西瓜</li>
        <li>葡萄</li>
        <li>香蕉</li>
        <li>荔枝</li>
        <li>苹果</li>
        <li>桃子</li>
        <li>梨子</li>
        <li>李子</li>
    </ul>
    <h4>type=circle 时的无序列表</h4>
    <ul type="circle">
        <li>桔子</li>
        <li>西瓜</li>
        <li>葡萄</li>
        <li>香蕉</li>
        <li>荔枝</li>
        <li>苹果</li>
        <li>桃子</li>
        <li>梨子</li>
        <li>李子</li>
    </ul>
    <h4>type=square 时的无序列表</h4>
    <ul type="square">
        <li>桔子</li>
        <li>西瓜</li>
        <li>葡萄</li>
        <li>香蕉</li>
        <li>荔枝</li>
        <li>苹果</li>
        <li>桃子</li>
        <li>梨子</li>
        <li>李子</li>
    </ul>
</body>

</html>
