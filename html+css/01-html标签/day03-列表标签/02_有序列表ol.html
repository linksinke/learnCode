<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta http-equiv="content-type" content="text/html;charset=UTF-8">
    <meta name="description" content="ol标签的使用">
    <title>HTML标签</title>
</head>

<body>
    ol是有序标签
    <hr />
    <h4>type=1 时的有序列表</h4>
    <ol>
        <li>北京</li>
        <li>上海</li>
        <li>广州</li>
    </ol>
    <h4>type=I 时的有序列表</h4>
    <ol type="I">
        <li>北京</li>
        <li>上海</li>
        <li>广州</li>
    </ol>
    <h4>type=i 时的有序列表</h4>
    <ol type="i">
        <li>北京</li>
        <li>上海</li>
        <li>广州</li>
    </ol>
    <h4>type=A 时的有序列表</h4>
    <ol type="A">
        <li>北京</li>
        <li>上海</li>
        <li>广州</li>
    </ol>
    <h4>type=a 时的有序列表</h4>
    <ol type="a">
        <li>北京</li>
        <li>上海</li>
        <li>广州</li>
    </ol>
    <h4>列表起始值不重新开始</h4>
    <ol type="1" start="4">
        <li>北京</li>
        <li>上海</li>
        <li>广州</li>
    </ol>
</body>

</html>
