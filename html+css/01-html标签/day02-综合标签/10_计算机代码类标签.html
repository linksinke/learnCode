<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01//EN" "http://www.w3.org/TR/html4/strict.dtd">
<html>

<head>
    <meta charset="UTF-8">
    <meta http-equiv="content-type" content="text/html;charset=UTF-8">
    <meta name="description" content="q标签的使用">
    <title>HTML标签</title>
</head>

<body>
    <code>：用于标记计算机通用代码。
    <kbd>：用于标记输入电脑的键盘（或其他类型）输入。
    <samp>：用于标记计算机程序的输出。
    <var>：用于标记具体变量名。
    
    
    <!-- code 标签 -->
    </hr>
    <p>code标签是定义计算机代码的标签，另外code标签是不会保留空格和折行的</p>
    <code>System.out.println("This is a java code.");</code>
    <code>
        var a = "Hello";
        alert(a);
    </code>
    
    <!-- kbd 标签 -->
    </hr>
    <p>kbd标签是定义键盘输入的</p>
    <kbd>
        File Test 繁体字 简体字
    </kbd>
    
    
    <!-- samp 标签 -->
    </hr>
    <p>samp标签用来定义计算机输出示例</p>
    <samp>demo例子输出时间 2017.8.4 PM 3:25:0:0</samp>
    
    
    <!-- var 标签 -->
    </hr>
    <p>var标签用来定义数学变量</p>
    勾股定理：<var>c<sup>2</sup>=a<sup>2</sup>+b<sup>2</sup></var>
   
</body>

</html>
