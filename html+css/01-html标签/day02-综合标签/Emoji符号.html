    表情符号（Emoji）类似图像或图标，但它们并不是，它们是来自 UTF-8 (Unicode) 字符集的字母（字符）。<br />
    提示：UTF-8 几乎涵盖世界上所有字符和符号。<br />
    为了让浏览器了解您正在显示字符，您必须以 &# 开头并以 ;（分号）结束实体编号。<br />
    <hr />
